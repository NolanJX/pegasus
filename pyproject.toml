[project]
name = "pegasus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Ruff uses the minimum of this range as its target-version — https://docs.astral.sh/ruff/settings/#target-version
# ty uses the minimum of this range as its python-version — https://docs.astral.sh/ty/python-version/
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.109.1",
    "langchain[deepseek,openai]>=1.3.11",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
    "ty==0.0.55",  # keep in sync with the ty rev in .pre-commit-config.yaml
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
